name: AWS OIDC Smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  aws-oidc-smoke:
    name: Validate AWS OIDC and Terraform backend
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_BACKEND_KEY: ${{ vars.TF_BACKEND_KEY }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check branch-scoped OIDC context
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "This workflow must run from refs/heads/main because the AWS OIDC role trust is branch-scoped."
            echo "Current ref: ${GITHUB_REF}"
            exit 1
          fi

      - name: Validate required repository variables
        run: |
          for name in AWS_REGION AWS_ROLE_TO_ASSUME TF_BACKEND_BUCKET TF_BACKEND_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required repository variable: ${name}"
              exit 1
            fi
          done

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          mask-aws-account-id: true

      - name: Verify AWS caller identity
        run: aws sts get-caller-identity

      - name: Generate dev backend configuration
        working-directory: infrastructure/envs/dev
        run: |
          cat > backend.tf <<EOF
          terraform {
            backend "s3" {
              bucket       = "${TF_BACKEND_BUCKET}"
              key          = "${TF_BACKEND_KEY}"
              region       = "${AWS_REGION}"
              encrypt      = true
              use_lockfile = true
            }
          }
          EOF

      - name: Terraform init
        working-directory: infrastructure/envs/dev
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: infrastructure/envs/dev
        run: terraform validate -no-color

      - name: Read remote-backed Terraform output
        working-directory: infrastructure/envs/dev
        run: terraform output aws_region

      - name: Verify remote state object
        run: |
          aws s3api head-object \
            --region "${AWS_REGION}" \
            --bucket "${TF_BACKEND_BUCKET}" \
            --key "${TF_BACKEND_KEY}" \
            --query "{ContentLength:ContentLength,ServerSideEncryption:ServerSideEncryption,VersionId:VersionId}"
